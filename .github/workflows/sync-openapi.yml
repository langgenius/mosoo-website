name: Sync OpenAPI reference

on:
  workflow_dispatch:
    inputs:
      mosoo_ref:
        description: Mosoo ref, branch, tag, or SHA to generate from
        required: false
        default: main
  repository_dispatch:
    types: [mosoo-openapi-changed]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-openapi-reference
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs
        uses: actions/checkout@v6
        with:
          path: docs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate localized OpenAPI specs and agent references
        run: npm run openapi:sync
        working-directory: docs
        env:
          MOSOO_REPO_REF: ${{ github.event.client_payload.sha || github.event.client_payload.ref || inputs.mosoo_ref || 'main' }}
          MOSOO_REPO_TOKEN: ${{ secrets.MOSOO_REPO_TOKEN }}

      - name: Commit generated specs
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenAPI specs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt coding-agents.md mosoo-openapi.generated.json mosoo-openapi.en.generated.json mosoo-openapi.zh-Hans.generated.json scripts package.json README.md
          git commit -m "docs: sync OpenAPI reference"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        working-directory: docs
