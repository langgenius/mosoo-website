"$schema" = "./node_modules/wrangler/config-schema.json"

name = "mosoo-website"
compatibility_date = "2026-07-02"
main = "src/worker.js"

# This Worker serves HTTP and consumes API Tail events; it has no scheduled handler.
# Omitting triggers preserves old remote schedules instead of removing them.
[triggers]
crons = []

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "STATUS_STORE"
class_name = "StatusStore"

[env.prod]
name = "mosoo-website-prod"
workers_dev = false

[env.prod.triggers]
crons = []

[[env.prod.durable_objects.bindings]]
name = "STATUS_STORE"
class_name = "StatusStore"

[[env.prod.routes]]
pattern = "mosoo.ai"
custom_domain = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatusStore"]
