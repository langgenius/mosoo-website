<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-source Agent runtime for application backends | mosoo</title>
    <meta
      name="description"
      content="mosoo is an open-source Agent runtime for app backends. Run OpenAI Codex, Claude Agent SDK, OpenCode, and Pi behind one API, with a sandbox per Session."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f7f6f1" />
    <link rel="canonical" href="https://mosoo.ai/en" />
    <link rel="alternate" hreflang="en" href="https://mosoo.ai/en" />
    <link rel="alternate" hreflang="zh-CN" href="https://mosoo.ai/zh" />
    <link rel="alternate" hreflang="ja" href="https://mosoo.ai/ja" />
    <link rel="alternate" hreflang="x-default" href="https://mosoo.ai/en" />
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero H1 is set in the display face (Literata), which the browser only finds once React renders it. Fetch
         it with the page so the headline does not reflow (and shift the hero) when the font arrives late on slow networks.
         The same goes for Geist, the text face: the hero lead and buttons are set in it, and in Chinese and Japanese
         a lead that wraps only at phrase edges can lose a line when Geist replaces the system font. -->
    <link
      rel="preload"
      href="/fonts/Literata-Variable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="mosoo" />
    <meta
      property="og:title"
      content="An open-source, API-first managed Agent runtime for application backends"
    />
    <meta
      property="og:description"
      content="Start an agent task from your backend with one request. Continue it in the same Session days later, on OpenAI Codex, Claude Agent SDK, OpenCode, or Pi."
    />
    <meta property="og:url" content="https://mosoo.ai/en" />
    <meta property="og:image" content="https://mosoo.ai/brand/social-card-20261019.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="mosoo: an open-source, API-first managed Agent runtime for application backends. One API, 4 runtimes: OpenAI Codex, Claude Agent SDK, OpenCode, and Pi." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mosooagent" />
    <meta
      name="twitter:title"
      content="An open-source, API-first managed Agent runtime for application backends"
    />
    <meta
      name="twitter:description"
      content="Start an agent task from your backend with one request. Continue it in the same Session days later, on OpenAI Codex, Claude Agent SDK, OpenCode, or Pi."
    />
    <meta name="twitter:image" content="https://mosoo.ai/brand/social-card-20261019.png" />
    <meta name="twitter:image:alt" content="mosoo: an open-source, API-first managed Agent runtime for application backends. One API, 4 runtimes: OpenAI Codex, Claude Agent SDK, OpenCode, and Pi." />

    <!-- mosoo:home-head (JSON-LD and fallback styles per locale, filled by scripts/landing-locales.mjs) -->
  </head>

    <div id="root"><!-- mosoo:home-fallback (the full home page as static HTML per locale, filled by scripts/landing-locales.mjs; React replaces it on mount) --></div>

  </body>
</html>
