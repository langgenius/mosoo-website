    <!-- Before first paint: the nav engine's CTA slot starts closed under .js, and the copy button shows only with JS
         (src/effects/v5/README.md). Without JS the class never lands and the static page stays complete. -->
    <script>document.documentElement.classList.add("js")</script>
    <!-- The first screen sets the H1 in the display face (Roboto Serif), the lead and buttons in Hanken Grotesk
         and the stage's Call card (its request string and file name) in Fragment Mono: fetch all three with the page
         so the headline does not reflow when they arrive late on slow networks. -->
    <link rel="preload" href="/fonts/RobotoSerif-display-wdth86-opsz36-wght440-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/HankenGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/FragmentMono-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
