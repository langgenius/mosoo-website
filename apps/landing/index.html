<html lang="en" data-damp>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open-source Agent runtime for application backends | mosoo</title>
    <meta
      name="description"
      content="An open-source, API-first managed Agent runtime for application backends. Run OpenAI Codex, Claude Agent SDK, OpenCode, and Pi behind one API, each Session in its own sandbox."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f4f4f4" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Before first paint: the nav engine's CTA slot starts closed under .js, and the copy button shows only with JS
         (src/effects/v5/README.md). Without JS the class never lands and the static page stays complete. -->
    <script>document.documentElement.classList.add("js")</script>
    <!-- The first screen sets the H1 in the display face (Hedvig Letters Serif), the lead and buttons in Inter and the
         harness keycaps in Fragment Mono: fetch all three with the page so the headline does not reflow when they
         arrive late on slow networks. -->
    <link rel="preload" href="/fonts/HedvigLettersSerif-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/FragmentMono-Regular-latin.woff2" as="font" type="font/woff2" crossorigin />
